
services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: smartpark-backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      APP_NAME: SmartPark API
      APP_VERSION: 1.0.0
      API_V1_PREFIX: /api/v1
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: smartpark

    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7

    container_name: smartpark-mongodb

    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - smartpark_mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  smartpark_mongo_data:

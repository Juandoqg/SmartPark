
services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: smartpark-backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      APP_NAME: SmartPark API
      APP_VERSION: 1.0.0
      API_V1_PREFIX: /api/v1
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: smartpark
      DATABASE_BACKEND: ${DATABASE_BACKEND:-mongodb}
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://postgres:postgres@postgres:5432/smartpark}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: redis://redis:6379/0
      REDIS_AVAILABILITY_TTL_SECONDS: ${REDIS_AVAILABILITY_TTL_SECONDS:-60}
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongodb:
    image: mongo:7

    container_name: smartpark-mongodb

    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - smartpark_mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: smartpark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartpark
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - smartpark_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartpark"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartpark-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  smartpark_mongo_data:
  smartpark_postgres_data:
